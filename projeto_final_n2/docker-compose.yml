services:
  postgres:
    image: postgres:16
    container_name: projeto_final_n2_postgres
    environment:
      POSTGRES_DB: projeto_final_n2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
